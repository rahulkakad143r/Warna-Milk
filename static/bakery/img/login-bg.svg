<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gokul Milk backdrop">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241811"/>
      <stop offset="38%" stop-color="#3D2A1D"/>
      <stop offset="72%" stop-color="#5A3B26"/>
      <stop offset="100%" stop-color="#77502F"/>
    </linearGradient>

    <radialGradient id="glowA" cx="78%" cy="22%" r="62%">
      <stop offset="0%" stop-color="#E2B063" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#C1823F" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C1823F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="18%" cy="86%" r="55%">
      <stop offset="0%" stop-color="#B4763C" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#B4763C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowC" cx="52%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#F0D2A0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F0D2A0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A110B" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#1A110B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1A110B" stop-opacity="0.55"/>
    </linearGradient>

    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F6EFE2" opacity="0.05"/>
      <circle cx="6" cy="5.5" r="1" fill="#F6EFE2" opacity="0.035"/>
    </pattern>

    <g id="wheat">
      <path d="M0 0 C -13 -16 -13 -34 0 -50 C 13 -34 13 -16 0 0 Z" fill="currentColor"/>
      <path d="M0 -6 L0 -46" stroke="#2A1C12" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    </g>

    <g id="crumb">
      <ellipse cx="0" cy="0" rx="26" ry="18" fill="currentColor"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>
  <rect width="1920" height="1080" fill="url(#glowC)"/>
  <rect width="1920" height="1080" fill="url(#grain)"/>

  <!-- warm light pools, like an oven-lit counter -->
  <g fill="#F3D6A4">
    <circle cx="1420" cy="300" r="150" opacity="0.05"/>
    <circle cx="1660" cy="560" r="96"  opacity="0.045"/>
    <circle cx="1230" cy="150" r="70"  opacity="0.05"/>
    <circle cx="420"  cy="880" r="120" opacity="0.04"/>
    <circle cx="860"  cy="960" r="84"  opacity="0.035"/>
  </g>

  <!-- wheat sprigs, top-left and bottom-right -->
  <g color="#D9A85F" opacity="0.16">
    <g transform="translate(120 150) rotate(-24)">
      <use href="#wheat" transform="scale(1.5)"/>
      <use href="#wheat" transform="translate(-26 40) rotate(-16) scale(1.1)"/>
      <use href="#wheat" transform="translate(26 40) rotate(16) scale(1.1)"/>
      <use href="#wheat" transform="translate(-50 78) rotate(-30) scale(0.85)"/>
      <use href="#wheat" transform="translate(50 78) rotate(30) scale(0.85)"/>
    </g>
    <g transform="translate(1810 960) rotate(158)">
      <use href="#wheat" transform="scale(1.35)"/>
      <use href="#wheat" transform="translate(-24 36) rotate(-16) scale(1)"/>
      <use href="#wheat" transform="translate(24 36) rotate(16) scale(1)"/>
    </g>
  </g>

  <!-- scattered crumbs -->
  <g color="#EBCB96" opacity="0.13">
    <use href="#crumb" transform="translate(320 250) scale(0.7) rotate(-12)"/>
    <use href="#crumb" transform="translate(640 760) scale(0.5) rotate(20)"/>
    <use href="#crumb" transform="translate(1080 300) scale(0.42) rotate(-30)"/>
    <use href="#crumb" transform="translate(1520 860) scale(0.62) rotate(8)"/>
    <use href="#crumb" transform="translate(1780 180) scale(0.45) rotate(35)"/>
    <use href="#crumb" transform="translate(250 640) scale(0.38) rotate(-5)"/>
  </g>

  <!-- soft arc sweeps -->
  <g fill="none" stroke="#F3D6A4" stroke-opacity="0.07" stroke-width="2">
    <circle cx="1500" cy="420" r="250"/>
    <circle cx="1500" cy="420" r="380"/>
    <circle cx="1500" cy="420" r="520"/>
  </g>

  <rect width="1920" height="1080" fill="url(#sheen)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
